<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applied Physics Lab: digital twin | Al-Kawthar University</title>
<meta name="author" content="Muhammad Daniyal Chundrigar, Lecturer, Computer Science Department, Al-Kawthar University">
<meta name="description" content="Interactive simulations of the Applied Physics Lab manual (Labs 2 to 14), Al-Kawthar University.">
<!--
  Applied Physics Lab: digital twin of the lab manual
  Created by Muhammad Daniyal Chundrigar
  Lecturer, Computer Science Department, Al-Kawthar University
  One self-contained file: no installation, works offline.
-->
<style>
:root{
  --paper:#fff; --ink:#151d45; --ink2:#4a5378; --ink3:#7b83a3; --line:#dfe3ef; --wash:#f5f7fc;
  --brand:#2a3890; --wave:#2f86c9;
  --v:#1f63c4; --i:#d2470b; --r:#0b7a5a; --t:#7a3ec8;
  --ok:#0b7a5a; --warn:#b45309; --bad:#c62828;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wave);outline-offset:2px}

/* ---------- page frame ---------- */
.top{display:flex;align-items:center;gap:18px 24px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:48px;width:auto;display:block}
.top .ttl{font-size:21px;font-weight:700;color:var(--brand);line-height:1.2;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--ink2)}
.top .mid{flex:1 1 280px;min-width:0}
.top .by{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.45}
.top .by b{color:var(--ink);font-weight:600;display:block;font-size:14px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
.side{padding:14px 10px 20px;position:sticky;top:0;max-height:100vh;overflow:auto}
.side p{margin:4px 10px 8px;font-size:12.5px;color:var(--ink3)}
.side a{display:grid;grid-template-columns:26px 1fr;gap:4px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3;border-left:3px solid transparent}
.side a .no{font-family:var(--mono);color:var(--ink3);font-size:13px}
.side a:hover{background:var(--wash)}
.side a[aria-current=page]{background:#eef1fb;border-left-color:var(--brand);font-weight:600;color:var(--brand)}
.side a[aria-current=page] .no{color:var(--brand)}
.side a.pg{grid-template-columns:1fr}
.who{margin:16px 10px 0;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:12.5px;color:var(--ink2)}
.who input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:13px;background:#fff}
main{padding:22px 28px 40px;max-width:1260px;width:100%;min-width:0;border-left:1px solid var(--line);min-height:calc(100vh - 73px)}

/* ---------- lab page ---------- */
.lab-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.lab-no{margin:0;color:var(--wave);font-weight:600;font-size:14px}
.lab h1{margin:2px 0 6px;font-size:28px;line-height:1.15;letter-spacing:-.015em;font-weight:700}
.aim{margin:0;max-width:72ch;color:var(--ink2)}
.steps{margin:14px 0 0;border:1px solid var(--line);border-radius:8px;padding:0 14px}
.steps summary{cursor:pointer;font-weight:600;font-size:14px;padding:9px 0;color:var(--brand)}
.steps ol{margin:0 0 12px;padding-left:20px;columns:2;column-gap:32px;font-size:13.5px;color:var(--ink2)}
.steps li{break-inside:avoid;margin-bottom:4px}
.sec{margin-top:26px}
.sec>h2{font-size:17px;margin:0 0 10px;font-weight:600}
.sec>h2 small{font-weight:400;color:var(--ink3);font-size:13px;margin-left:8px}
.note{font-size:13px;color:var(--ink2);margin:8px 0 0;max-width:80ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:20px;align-items:start}
.stage{border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.controls{background:var(--wash);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:13px;min-width:0}
.controls h3{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.two>*{min-width:0}
.cap{font-size:12.5px;color:var(--ink2);margin:6px 0 0}
.stage .plot{margin-top:12px}
.stage>.respic-row{margin-top:12px}
.credit{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.credit img{height:26px;width:auto}
.credit b{color:var(--ink);font-weight:600}
.err{color:var(--bad)}

/* ---------- controls ---------- */
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.ctl-top label{font-weight:500}
.ctl-top output{font-family:var(--mono);font-weight:600;color:var(--c,var(--brand));font-size:14px;white-space:nowrap}
.ctl-row{display:grid;grid-template-columns:24px 1fr 24px;gap:6px;align-items:center;margin-top:3px}
.nudge{width:24px;height:24px;border:1px solid #cfd5e6;background:#fff;border-radius:5px;cursor:pointer;font:600 14px/1 var(--mono);color:var(--ink2);padding:0}
.nudge:hover{background:#eef1fb;color:var(--brand)}
.ctl-hint{font-size:12px;color:var(--ink3);margin-top:1px;line-height:1.35}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#cfd5e6}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#cfd5e6}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--c,var(--brand));border:3px solid #fff;box-shadow:0 0 0 1.5px var(--c,var(--brand));margin-top:-7px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--c,var(--brand));border:3px solid #fff;box-shadow:0 0 0 1.5px var(--c,var(--brand))}
.btn{font:500 13.5px var(--sans);white-space:nowrap;padding:7px 12px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;line-height:1.25}
.btn.ghost{background:#fff;color:var(--brand);border-color:#c5cbe6}
.btn:hover{filter:brightness(1.1)}
.btn.ghost:hover{background:#eef1fb;filter:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid #c5cbe6;border-radius:7px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;font:500 13.5px var(--sans);color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1px solid #c5cbe6}
.seg button[aria-selected=true]{background:var(--brand);color:#fff}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.field{display:grid;gap:3px;font-size:13.5px}
.field span{font-weight:500}
.field select,.field input,.field textarea{border:1px solid #cfd5e6;border-radius:6px;padding:6px 8px;background:#fff;font-size:13.5px;width:100%}
.field textarea{min-height:64px;resize:vertical}

/* ---------- instruments ---------- */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-top:12px}
.meter{border:1px solid var(--line);border-left:4px solid var(--c,var(--brand));border-radius:6px;padding:6px 10px;background:#fff;min-width:0}
.meter small{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.lcd{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--c,var(--ink));font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
.lcd span{font-size:13px;font-weight:500;margin-left:4px;color:var(--ink2)}
.meter.warn{border-color:var(--bad);background:#fff4f3}
.meter.warn .lcd{color:var(--bad)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:#eef1fb;color:var(--brand)}
.chip.ok{background:#e3f5ee;color:var(--ok)} .chip.warn{background:#fdf0dc;color:var(--warn)} .chip.bad{background:#fde8e6;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;font-size:13px;color:var(--ink2)}

/* ---------- schematic ---------- */
.schem{width:100%;height:auto;display:block;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;max-height:380px}
.schem text{stroke:none;fill:var(--ink);font:500 13px var(--sans)}
.schem text.val{font:600 12.5px var(--mono)}
.schem text.v{fill:var(--v)} .schem text.i{fill:var(--i)} .schem text.r{fill:var(--r)} .schem text.t{fill:var(--t)} .schem text.dim{fill:var(--ink3)}
.schem .q{fill:var(--i);stroke:none}
.schem .body{fill:#fff}
.schem .node{fill:var(--ink);stroke:none}
.schem .thin{stroke-width:1.2;stroke-dasharray:4 3;stroke:var(--ink3)}
.schem .sym{stroke-width:1.6}
.schem .sw{cursor:pointer}
.schem .sw .hit{fill:transparent;stroke:none}
.schem .sw:hover .knob{stroke:var(--wave)}
.schem .hot{fill:#ffd9cc}
.schem .on{stroke:var(--i)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{background:var(--wash);text-align:right;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:5px 10px;text-align:right;border-bottom:1px solid #eef0f6;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl td.empty{text-align:left;color:var(--ink3);font-family:var(--sans);padding:14px 10px;white-space:normal}
.tbl tr.now td{background:#fff7e0}
.tbl tr.sum td{font-weight:600;background:var(--wash)}
.tbl td.txt{font-family:var(--sans)}
.tbl-title{font-weight:600;font-size:14px;margin:0 0 6px}

/* ---------- plots ---------- */
.plot{margin:0}
.plot figcaption{font-weight:600;font-size:14px;margin-bottom:6px}
.plot-wrap{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plot-wrap canvas,.viz{display:block;width:100%}
.plot-tip{position:absolute;display:none;pointer-events:none;background:var(--ink);color:#fff;font:12px var(--mono);padding:3px 7px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-150%);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.vizbox{border:1px solid var(--line);border-radius:8px;overflow:hidden}

/* ---------- calculations and insight ---------- */
.calc{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.calc-row{display:grid;grid-template-columns:30% minmax(0,1fr) auto;gap:12px;padding:8px 12px;border-bottom:1px solid #eef0f6;align-items:baseline;font-size:13.5px}
.calc-row:last-child{border-bottom:0}
.calc-w{font-family:var(--mono);color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
.calc-v{font-family:var(--mono);white-space:nowrap;font-weight:600}
.insight{background:#f2f8fd;border-left:4px solid var(--wave);border-radius:0 8px 8px 0;padding:12px 16px}
.insight p{margin:0 0 8px;max-width:78ch}
.insight p:last-child,.insight ul:last-child{margin-bottom:0}
.insight ul{margin:4px 0 8px;padding-left:20px}
.insight li{margin-bottom:3px;max-width:76ch}
.share{margin-top:10px}
.share-t{font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.share-b{display:flex;height:26px;border-radius:5px;overflow:hidden;background:#eef0f6}
.share-b span{display:flex;align-items:center;justify-content:center;min-width:2px;overflow:hidden;transition:width .15s}
.share-b em{font:600 11.5px var(--mono);color:#fff;white-space:nowrap;padding:0 4px;font-style:normal}
.respic{display:block;width:100%;max-width:300px;height:auto}
.led-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}


/* ---------- title page, preface, component explorer ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:center;padding:14px 0 6px}
.cover-uni{margin:0;font-weight:600;color:var(--wave);font-size:15px}
.cover h1{font-size:clamp(34px,4.4vw,56px);line-height:1.03;letter-spacing:-.025em;margin:10px 0 14px;color:var(--brand);font-weight:700}
.cover-code{margin:0 0 16px;font-size:16px;font-weight:500}
.cover-lead{margin:0 0 20px;color:var(--ink2);max-width:46ch}
.cover-by{margin:24px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.cover-by b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.cover-art .hint{font-size:13px;color:var(--ink2);margin:0 0 8px}
.cover-art .ctl2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.toc{columns:2;column-gap:28px;margin:0;padding:0;list-style:none}
.toc li{break-inside:avoid}
.toc a{display:grid;grid-template-columns:36px 1fr;padding:9px 8px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14.5px}
.toc a:hover{background:var(--wash);color:var(--brand)}
.toc .no{font-family:var(--mono);color:var(--wave);font-weight:600}
.preface{max-width:70ch;font-size:16.5px;line-height:1.65}
.preface h1{font-size:34px;letter-spacing:-.02em;margin:6px 0 18px;color:var(--brand)}
.preface p{margin:0 0 16px}
.sign{margin:26px 0 22px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;line-height:1.55}
.sign b{font-size:16.5px}
.sign a{color:var(--brand)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-bottom:16px}
.pick{border:1px solid #c5cbe6;background:#fff;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;font:500 13.5px var(--sans);color:var(--ink);display:flex;gap:8px;align-items:baseline}
.pick small{font-family:var(--mono);color:var(--ink3);font-size:12px}
.pick:hover{background:#eef1fb}
.pick[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.pick[aria-pressed=true] small{color:#cdd3f5}
.comp>h3{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.comp .purpose{margin:0 0 12px;color:var(--ink2);max-width:70ch}
.fig{margin:0 0 12px;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.fig img{max-width:100%;max-height:300px;height:auto;vertical-align:middle}
.fig figcaption{font-size:12.5px;color:var(--ink2);margin-top:6px}
.parts{margin:4px 0 0;padding-left:18px;font-size:14px}
.parts li{margin-bottom:5px}
.try{border:1px solid var(--line);border-radius:10px;padding:14px}
.try>h4{margin:0 0 10px;font-size:14px;color:var(--brand)}
.try .controls{margin-top:12px}
.say{font-size:14px;margin:10px 0 0;min-height:2.6em}
.say b{color:var(--brand)}
.bb{width:100%;height:auto;display:block}
.bb circle{fill:#aab1c4;cursor:pointer}
.bb circle.hl{fill:var(--i)}
.pin{cursor:pointer}
.pin rect,.pin line{transition:none}
.pin.hl rect{fill:var(--i)}
.pin.hl line,.pin.hl path{stroke:var(--i)}
.pin.hl text{fill:var(--i);font-weight:700}
.sw-row{display:flex;align-items:center;gap:8px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:6px}
@media(max-width:1040px){.bench,.two,.cover{grid-template-columns:minmax(0,1fr)}.steps ol{columns:1}}
@media(max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:8px 12px;max-height:none}
  main{border-left:0}
  .side p,.who{display:none}
  .side a{flex:0 0 auto;grid-template-columns:auto auto;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap}
  .side a[aria-current=page]{border-bottom-color:var(--brand)}
  main{padding:16px 14px 32px}
  .lab h1{font-size:23px}
  .lab-head{flex-wrap:wrap}
  .btn{white-space:normal}
  .top{padding:10px 14px}.top .by{margin-left:0;text-align:left}
  .calc-row{grid-template-columns:1fr auto}.calc-w{grid-column:1/-1;order:3}
  .toc{columns:1}
  .cover-art .ctl2{grid-template-columns:1fr}
}
@media print{
  .side,.controls .btns,.nudge,.lab-head .btn,.steps{display:none!important}
  .shell{display:block}.top{border:0;padding:0 0 8px}
  main{padding:0;max-width:none}
  .sec,.stage,.calc,.tbl-wrap,.plot{break-inside:avoid}
  body{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.share-b span{transition:none}}

</style>
</head>

<script>
'use strict';
/* =====================================================================
   Applied Physics Lab: digital twin
   Created by Muhammad Daniyal Chundrigar, Lecturer,
   Computer Science Department, Al-Kawthar University.
   Part 1: shared toolkit used by every lab.

const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const SUB = ['₀', '₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];
const PAL = ['#2a3890', '#d2470b', '#0b7a5a', '#7a3ec8', '#b0268a'];
const CV = { v: '#1f63c4', i: '#d2470b', r: '#0b7a5a', t: '#7a3ec8' };

/* Everything that needs stopping when a lab closes registers itself here. */
let DISP = [];
function scoped(fn) {
  const prev = DISP, mine = [];
  DISP = mine;
  try { fn(); } finally { DISP = prev; }
  const d = () => mine.splice(0).forEach(f => { try { f(); } catch (e) { /* ignore */ } });
  prev.push(d);            // closing the parent also closes this scope
  return d;
}
/* A replaceable part of a lab (a tab, a redrawn circuit). Call the returned function with a builder;
   the previous build is closed first, and everything is closed when the lab itself closes. */
function subScope() {
  const parent = DISP; let kill = null;
  return fn => { if (kill) kill(); const prev = DISP; DISP = parent; try { kill = scoped(fn); } finally { DISP = prev; } };
}

/* ---------- DOM builders ---------- */
function setA(e, a) {
  if (!a) return;
  for (const k in a) {
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style' && typeof v === 'object') { for (const s in v) s.startsWith('--') ? e.style.setProperty(s, v[s]) : (e.style[s] = v[s]); }
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
}
function addK(e, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
}
function el(tag, a, ...kids) { const e = document.createElement(tag); setA(e, a); addK(e, kids); return e; }
function sv(tag, a, ...kids) { const e = document.createElementNS(NS, tag); setA(e, a); addK(e, kids); return e; }
const $ = (s, r = document) => r.querySelector(s);

/* ---------- numbers ---------- */
function fx(x, d = 2) {
  if (!Number.isFinite(x)) return '—';
  const s = x.toFixed(d);
  return +s === 0 ? s.replace('-', '') : s.replace('-', '−');
}
function sig(x, n = 3) { return Number.isFinite(x) ? String(+x.toPrecision(n)).replace('-', '−') : '—'; }
function fR(o, n = 3) { return !Number.isFinite(o) ? '—' : o >= 1e6 ? sig(o / 1e6, n) + ' MΩ' : o >= 1e3 ? sig(o / 1e3, n) + ' kΩ' : sig(o, n) + ' Ω'; }
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
/* A real component from the box: inside its tolerance band, rarely at the edge. */
function realR(nom, tol = 0.05) { return nom * (1 + clamp(gauss() * tol / 2.5, -tol, tol)); }
/* A multimeter reading: small gain error, last-digit flicker, finite resolution. */
function rd(v, res, acc = 0.003) { return v === 0 ? 0 : Math.round((v * (1 + acc * gauss()) + res * 0.3 * gauss()) / res) * res; }
function bisect(f, lo, hi, n = 44) {
  let flo = f(lo);
  for (let i = 0; i < n; i++) { const m = (lo + hi) / 2, fm = f(m); if ((fm > 0) === (flo > 0)) { lo = m; flo = fm; } else hi = m; }
  return (lo + hi) / 2;
}
function pctErr(theo, prac) { return Math.abs(theo - prac) / Math.abs(theo) * 100; }
function linfit(pts) {
  const n = pts.length; if (n < 2) return null;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (const [x, y] of pts) { sx += x; sy += y; sxy += x * y; sxx += x * x; }
  const d = n * sxx - sx * sx; if (Math.abs(d) < 1e-12) return null;
  const m = (n * sxy - sx * sy) / d; return { m, c: (sy - m * sx) / n };
}
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
/* All two-significant-figure resistor values between lo and hi (so every value has a 4-band colour code). */
function rList(lo, hi) {
  const out = [];
  for (let d = 1; d <= 1e5; d *= 10) for (let m = 10; m < 100; m++) { const v = m * d; if (v >= lo - 1e-9 && v <= hi + 1e-9) out.push(v); }
  if (out[out.length - 1] < hi) out.push(hi);
  return out;
}
function nearest(list, v) { let b = 0, bd = Infinity; list.forEach((x, i) => { const d = Math.abs(Math.log(x / v)); if (d < bd) { bd = d; b = i; } }); return b; }

/* ---------- schematic drawing with moving charge ---------- */
class Schem {
  constructor(w, h, label) {
    this.gW = sv('g'); this.gF = sv('g'); this.gC = sv('g'); this.gT = sv('g');
    this.svg = sv('svg', { viewBox: `0 0 ${w} ${h}`, class: 'schem', role: 'img', 'aria-label': label || 'Circuit diagram' }, this.gW, this.gF, this.gC, this.gT);
    this.flows = []; this.last = performance.now(); this.alive = true; this.onFrame = null;
    const loop = t => {
      if (!this.alive) return;
      const dt = Math.min(.05, (t - this.last) / 1000); this.last = t;
      if (this.onFrame) this.onFrame(t / 1000, dt);
      for (const fl of this.flows) {
        const I = fl.fn(), a = Math.abs(I) / fl.ref, vis = a >= 0.004;
        if (vis && !REDUCED) fl.off = (fl.off + Math.sign(I) * (14 + 95 * Math.min(1.5, Math.pow(a, .7))) * dt) % fl.L;
        const gap = fl.L / fl.dots.length;
        fl.dots.forEach((c, i) => {
          if (!vis) { c.setAttribute('opacity', 0); return; }
          const s = (((fl.off + i * gap) % fl.L) + fl.L) % fl.L;
          const sg = fl.segs.find(q => s <= q.s + q.l) || fl.segs[fl.segs.length - 1], u = s - sg.s;
          c.setAttribute('cx', sg.x + sg.dx * u); c.setAttribute('cy', sg.y + sg.dy * u); c.setAttribute('opacity', Math.min(1, .45 + a));
        });
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    DISP.push(() => { this.alive = false; cancelAnimationFrame(this.raf); });
  }
  wire(...pts) { this.gW.append(sv('polyline', { points: pts.map(p => p[0] + ',' + p[1]).join(' ') })); return this; }
  thin(...pts) { this.gW.append(sv('polyline', { class: 'thin', points: pts.map(p => p[0] + ',' + p[1]).join(' ') })); return this; }
  path(d) { this.gW.append(sv('path', { d })); return this; }
  /* Conventional current runs along pts when fn() is positive. ref = the current that counts as "full speed". */
  flow(pts, fn, ref) {
    const segs = []; let L = 0;
    for (let i = 1; i < pts.length; i++) { const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1], l = Math.hypot(dx, dy); if (l < .01) continue; segs.push({ x: pts[i - 1][0], y: pts[i - 1][1], dx: dx / l, dy: dy / l, l, s: L }); L += l; }
    const n = Math.max(2, Math.round(L / 26)), dots = [];
    for (let i = 0; i < n; i++) { const c = sv('circle', { r: 3.2, class: 'q', opacity: 0 }); this.gF.append(c); dots.push(c); }
    this.flows.push({ segs, L, dots, fn, off: 0, ref: ref || 1 }); return this;
  }
  dot(x, y) { this.gC.append(sv('circle', { cx: x, cy: y, r: 3.5, class: 'node' })); return this; }
  text(x, y, s, cls, anchor) { const t = sv('text', { x, y, class: cls || '', 'text-anchor': anchor || 'start' }); t.textContent = s; this.gT.append(t); return t; }
  R(x, y, vert) { const r = sv('rect', vert ? { x: x - 9, y: y - 28, width: 18, height: 56, class: 'body' } : { x: x - 28, y: y - 9, width: 56, height: 18, class: 'body' }); this.gC.append(r); return r; }
  vsrc(x, y, kind) {          // vertical source, + terminal on top
    const g = sv('g', {}, sv('circle', { cx: x, cy: y, r: 20, class: 'body' }));
    if (kind === 'ac') g.append(sv('path', { d: `M${x - 11},${y} q5.5,-14 11,0 t11,0` }));
    else if (kind === 'sq') g.append(sv('path', { d: `M${x - 11},${y + 6} h5 v-12 h6 v12 h6 v-12 h5` }));
    else g.append(sv('path', { class: 'sym', d: `M${x - 5},${y - 9} h10 M${x},${y - 14} v10 M${x - 5},${y + 10} h10` }));
    this.gC.append(g); return g;
  }
  hsrc(x, y) {                // horizontal source, + terminal on the left
    this.gC.append(sv('g', {}, sv('circle', { cx: x, cy: y, r: 20, class: 'body' }), sv('path', { class: 'sym', d: `M${x - 14},${y} h10 M${x - 9},${y - 5} v10 M${x + 5},${y} h10` }))); return this;
  }
  gnd(x, y) { this.gC.append(sv('path', { d: `M${x},${y} v8 M${x - 12},${y + 8} h24 M${x - 8},${y + 13} h16 M${x - 4},${y + 18} h8` })); return this; }
  vcc(x, y, label) { this.gC.append(sv('path', { class: 'body', d: `M${x},${y - 12} l8,12 h-16 Z` })); this.text(x + 14, y - 3, label || 'Vcc'); return this; }
  term(x, y) { this.gC.append(sv('circle', { cx: x, cy: y, r: 5, class: 'body' })); return this; }
  meter(x, y, ch) { this.gC.append(sv('circle', { cx: x, cy: y, r: 14, class: 'body' })); this.text(x, y + 5, ch, '', 'middle'); return this; }
  diode(x, y, dir) {          // horizontal; dir = 1 points right (anode on the left)
    const d = dir || 1;

  }
  led(x, y) {                 // vertical, anode on top

    const lens = sv('circle', { cx: x, cy: y, r: 19, class: 'body' });

    return { set(b, col) { const c = col || '#ff3b30'; glow.setAttribute('fill', c); glow.setAttribute('opacity', b * .35); lens.style.fill = b > 0.02 ? c : '#fff'; lens.style.fillOpacity = b > 0.02 ? .25 + .75 * b : 1; } };
  }
  cap(x, y) { this.gC.append(sv('rect', { x: x - 15, y: y - 5, width: 30, height: 10, fill: '#fff', stroke: 'none' }), sv('path', { d: `M${x - 14},${y - 5} h28 M${x - 14},${y + 5} h28`, 'stroke-width': 2.5 })); return this; }
  npn(x, y) {                 // terminals: B (x-28, y)  C (x+12, y-30)  E (x+12, y+30)
    const ux = .866, uy = .5, tx = x + 12, ty = y + 20;
    const head = `M${tx},${ty} L${tx - 10 * ux + 4.5 * uy},${ty - 10 * uy - 4.5 * ux} L${tx - 10 * ux - 4.5 * uy},${ty - 10 * uy + 4.5 * ux} Z`;
    const g = sv('g', {}, sv('circle', { cx: x + 2, cy: y, r: 24, class: 'body' }),
      sv('path', { d: `M${x - 28},${y} H${x - 10} M${x - 10},${y - 7} L${x + 12},${y - 20} V${y - 30} M${x - 10},${y + 7} L${x + 12},${y + 20} V${y + 30}` }),
      sv('path', { d: `M${x - 10},${y - 15} v30`, 'stroke-width': 4 }), sv('path', { d: head, fill: 'currentColor', class: 'node', stroke: 'none' }));
    this.gC.append(g); return g;
  }
  opamp(x, y) {               // inputs at (x-30, y∓16); output at (x+36, y)
    this.gC.append(sv('path', { class: 'body', d: `M${x - 30},${y - 34} L${x - 30},${y + 34} L${x + 36},${y} Z` }));
    this.text(x - 23, y - 11, '−'); this.text(x - 23, y + 21, '+'); return this;
  }
  sw(x, y, onToggle) {        // push switch between (x-18, y) and (x+18, y); click to toggle
    const bar = sv('path', { class: 'knob', 'stroke-width': 3 });
    const g = sv('g', { class: 'sw', tabindex: 0, role: 'switch', 'aria-checked': 'false' }, sv('rect', { class: 'hit', x: x - 26, y: y - 30, width: 52, height: 44 }),
      sv('circle', { cx: x - 14, cy: y, r: 4, class: 'body' }), sv('circle', { cx: x + 14, cy: y, r: 4, class: 'body' }), bar);
    let on = false;

/* ---------- lab registry and page frame ---------- */
const LABS = [];
function lab(def) { LABS.push(def); }
const CREDIT = { name: 'Muhammad Daniyal Chundrigar', role: 'Lecturer, Computer Science Department, Al-Kawthar University' };
function section(title, ...kids) { return el('section', { class: 'sec' }, title ? el('h2', { html: title }) : null, ...kids); }
function steps(list) { return el('details', { class: 'steps', open: true }, el('summary', {}, 'How to perform this lab here'), el('ol', {}, list.map(s => el('li', { html: s })))); }
function insight(html) { return el('div', { class: 'insight', html }); }
function viva(list) { return el('details', { class: 'steps' }, el('summary', {}, 'Viva questions from the manual'), el('ol', {}, list.map(s => el('li', {}, s)))); }
function startApp() {
  const side = $('#side'), main = $('#main'), logo = $('#logo').src;
  LABS.sort((a, b) => a.n - b.n);
  const who = { name: '', roll: '' };
  LABS.forEach(L => {
    L.key = L.page ? L.id : 'lab' + L.n;       // the title page and preface are plain pages, not numbered labs
    L._a = el('a', { href: '#' + L.key, class: L.page ? 'pg' : '', onclick: e => { e.preventDefault(); go(L.key); } }, L.page ? null : el('span', { class: 'no' }, String(L.n)), el('span', {}, L.short));
    side.append(L._a);
  });
  side.append(el('div', { class: 'who' }, 'Your details (shown when you print a lab)',
    el('input', { placeholder: 'Student name', 'aria-label': 'Student name', oninput: e => { who.name = e.target.value; stamp(); } }),
    el('input', { placeholder: 'Roll number', 'aria-label': 'Roll number', oninput: e => { who.roll = e.target.value; stamp(); } })));
  let dispose = null, stampEl = null;
  function stamp() { if (stampEl) stampEl.textContent = (who.name || who.roll) ? `Performed by ${who.name || '—'}${who.roll ? ', roll number ' + who.roll : ''}.` : ''; }
  function go(key) {
    const L = LABS.find(l => l.key === key) || LABS[0];
    if (dispose) dispose();
    LABS.forEach(l => l._a.removeAttribute('aria-current')); L._a.setAttribute('aria-current', 'page');
    const root = el('article', { class: 'lab' }); main.replaceChildren(root);
    stampEl = el('span');
    dispose = scoped(() => {
      if (!L.page) root.append(el('header', { class: 'lab-head' },
        el('div', {}, el('p', { class: 'lab-no' }, 'Lab ' + L.n), el('h1', {}, L.title), el('p', { class: 'aim' }, L.aim)),
        btn('Print this lab', () => { try { window.print(); } catch (e) { /* printing is blocked in some previews */ } }, true)));
      try { L.mount(root, go); } catch (err) { console.error(err); root.append(el('p', { class: 'err' }, 'This lab could not load: ' + err.message)); }
      root.append(el('footer', { class: 'credit' }, el('img', { src: logo, alt: 'Al-Kawthar University' }),
        el('span', {}, 'Created by ', el('b', {}, CREDIT.name), ', ' + CREDIT.role + '. ', stampEl)));
    });
    stamp();
    try { history.replaceState(null, '', '#' + L.key); } catch (e) { /* sandboxed preview */ }
    window.scrollTo(0, 0);
  }
  go((location.hash || '').slice(1) || LABS[0].key);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => PLOTS.forEach(p => p.draw()));
}

/* =====================================================================
   TITLE PAGE: a live circuit instead of a still picture
   ===================================================================== */
lab({
  n: -2, id: 'home', page: true, short: 'Title page',
  mount(root, go) {
    const S = { on: true, A: 6, f: 50, t: 0 }, R = 330, WIN = 0.04;
    const vs = t => S.A * Math.sin(2 * Math.PI * S.f * t);
    const il = t => S.on ? Math.max(0, vs(t) - 2.45) / R : 0;            // 0.65 V diode drop plus about 1.8 V for the LED
    const sc = new Schem(560, 236, 'A live circuit: sine-wave generator, switch, diode, resistor and LED');
    sc.wire([60, 105], [60, 45], [142, 45]).wire([178, 45], [250, 45]).wire([270, 45], [332, 45]).wire([388, 45], [480, 45], [480, 106]).wire([480, 144], [480, 205], [60, 205], [60, 145]);
    sc.flow([[60, 105], [60, 45], [480, 45], [480, 205], [60, 205], [60, 145]], () => il(S.t), 0.008);
    sc.vsrc(60, 125, 'ac'); const sw = sc.sw(160, 45, v => { S.on = v; draw(); }); sc.diode(260, 45, 1); sc.R(360, 45); const led = sc.led(480, 125); sc.gnd(270, 205);
    sc.text(160, 72, 'switch', 'dim', 'middle'); sc.text(260, 24, 'diode', 'dim', 'middle'); sc.text(360, 24, '330 Ω', 'dim', 'middle'); sc.text(444, 130, 'LED', 'dim', 'end');
    const tG = sc.text(88, 122, '', 'val v'), tF = sc.text(88, 140, '', 'val t'), tI = sc.text(360, 76, '', 'val i', 'middle');
    const P = new Plot({ paper: 'scope', h: 200, xLabel: 'Time (ms)', yLabel: 'Voltage (V)', x: { min: 0, max: WIN * 1000, step: 5 }, y: { min: -10, max: 10, step: 5 } });
    function draw() {
      const a = [], b = [];
      for (let k = 0; k <= 400; k++) { const t = WIN * k / 400; a.push([t * 1000, vs(t)]); b.push([t * 1000, il(t) * R]); }
      P.set({ series: [{ name: 'Generator output', color: '#c58a00', pts: a, w: 1.6 }, { name: 'Voltage across the resistor (follows the LED current)', color: CV.v, pts: b, w: 2.6 }] });
      sw.set(S.on); tG.textContent = fx(S.A, 1) + ' V peak'; tF.textContent = S.f + ' Hz';
    }

function lab2Uncertainty(host) {
  const NL = [3, 5, 10, 20, 30, 50, 100, 200, 300, 500];
  const S = { nom: 5.6, T: 300, off: 0.15, N: 100, x: [], y: [] };
  const noise = () => 0.015 * Math.sqrt(S.T / 300);

  /* Panel A: free electrons colliding with the vibrating lattice */
  let atoms = [], els = [];
  const lattice = animCanvas(210, (g, w, h, dt, st) => {
    if (st.resized || !atoms.length) {
      atoms = []; const px = 40, py = 38, sx = (w - px * 2) / 7, sy = (h - py * 2) / 2;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) atoms.push({ bx: px + c * sx, by: py + r * sy, x: 0, y: 0, ph: Math.random() * 6.28 });
      els = Array.from({ length: 30 }, () => { const a = Math.random() * 6.28; return { x: 20 + Math.random() * (w - 40), y: 10 + Math.random() * (h - 20), vx: Math.cos(a), vy: Math.sin(a), tr: [] }; });
    }
    const ratio = S.T / 300, spd = Math.sqrt(ratio) * 130, vib = Math.min(9, ratio * 2.8), t = performance.now() * 0.005 * Math.sqrt(ratio), heat = Math.min(1, S.T / 700);
    g.clearRect(0, 0, w, h);
    const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, '#fff'); gr.addColorStop(.5, `rgba(240,96,48,${.04 + .2 * heat})`); gr.addColorStop(1, '#fff');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#b9c0d4'; g.fillRect(0, 0, 10, h); g.fillRect(w - 10, 0, 10, h);
    atoms.forEach(a => { a.x = a.bx + Math.sin(t + a.ph) * vib; a.y = a.by + Math.cos(t * 1.3 + a.ph) * vib; });
    g.strokeStyle = 'rgba(180,120,60,.25)'; g.lineWidth = 1; g.beginPath();
    for (let i = 0; i < atoms.length; i++) for (let j = i + 1; j < atoms.length; j++) if (Math.hypot(atoms[i].bx - atoms[j].bx, atoms[i].by - atoms[j].by) < w / 6) { g.moveTo(atoms[i].x, atoms[i].y); g.lineTo(atoms[j].x, atoms[j].y); }
    g.stroke();
    atoms.forEach(a => { g.beginPath(); g.arc(a.x, a.y, 10, 0, 7); g.fillStyle = S.T > 450 ? '#f2701d' : '#f59a4a'; g.fill(); g.strokeStyle = '#c2410c'; g.lineWidth = 1.2; g.stroke(); g.fillStyle = '#fff'; g.font = 'bold 8px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('Cu⁺', a.x, a.y); });
    els.forEach(e => {
      e.x += e.vx * spd * dt; e.y += e.vy * spd * dt;
      if (e.x < 14 || e.x > w - 14) { e.vx *= -1; e.x = clamp(e.x, 14, w - 14); }
      if (e.y < 8 || e.y > h - 8) { e.vy *= -1; e.y = clamp(e.y, 8, h - 8); }
      for (const a of atoms) if (Math.hypot(e.x - a.x, e.y - a.y) < 15) { const an = Math.atan2(e.y - a.y, e.x - a.x) + (Math.random() - .5) * 1.2; e.vx = Math.cos(an); e.vy = Math.sin(an); }
      e.tr.push([e.x, e.y]); if (e.tr.length > 6) e.tr.shift();
      g.beginPath(); e.tr.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.strokeStyle = 'rgba(31,99,196,.3)'; g.lineWidth = 1.5; g.stroke();
      g.beginPath(); g.arc(e.x, e.y, 3.6, 0, 7); g.fillStyle = '#1f63c4'; g.fill();
    });
  });

  /* Panel B: zero-offset dial of the multimeter */
  const dial = drawCanvas(130, (g, w, h) => {
    const cx = w / 2, cy = h + 22, R = h * 0.86, a0 = Math.PI * 1.22, a1 = Math.PI * 1.78, az = (a0 + a1) / 2, off = clamp(S.off, -2, 2), an = a0 + (off + 2) / 4 * (a1 - a0), bad = Math.abs(S.off) >= 0.02;
    g.lineCap = 'butt'; g.beginPath(); g.arc(cx, cy, R, a0, a1); g.strokeStyle = '#e3e7f2'; g.lineWidth = 12; g.stroke();
    g.beginPath(); g.arc(cx, cy, R, Math.min(az, an), Math.max(az, an)); g.strokeStyle = bad ? 'rgba(210,71,11,.55)' : 'rgba(11,122,90,.5)'; g.lineWidth = 10; g.stroke();
    for (let i = 0; i <= 20; i++) { const a = a0 + i / 20 * (a1 - a0), mj = i % 5 === 0, inn = mj ? R - 18 : R - 10; g.beginPath(); g.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.lineTo(cx + Math.cos(a) * inn, cy + Math.sin(a) * inn); g.strokeStyle = i === 10 ? '#2a3890' : '#9aa3b8'; g.lineWidth = mj ? 2 : 1; g.stroke(); }

function lab2Graphing(host) {
  const data = [[1, 1.8], [2, 2.7], [3, 4.2], [4, 5.1], [5, 6.8], [6, 7.9], [7, 8.7], [8, 10.3]];
  const S = { swap: false, scale: '1', m: 1.2, c: 0.5, fit: false, circ: true, join: false, origin: true };
  const M = { up: meter('Points above the ruler', CV.v), dn: meter('Points below the ruler', CV.v), fit: meter('Least-squares line', CV.r) }, status = el('div', { class: 'chips' });
  const cv = drawCanvas(540, (g, w, h) => {
    const pts = data.map(p => S.swap ? [p[1], p[0]] : p), L = 74, R = 24, T = 46, B = 62, pw = w - L - R, ph = h - T - B;
    const xr = S.swap ? [0, 12] : [0, 10], yr = S.swap ? [0, 10] : [0, 12];
    if (!S.origin) { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); xr[0] = Math.min(...xs) - .5; xr[1] = Math.max(...xs) + .5; yr[0] = Math.min(...ys) - .8; yr[1] = Math.max(...ys) + .7; }
    const X = v => L + (v - xr[0]) / (xr[1] - xr[0]) * pw, Y = v => T + ph - (v - yr[0]) / (yr[1] - yr[0]) * ph;
    g.fillStyle = '#f5fbf6'; g.fillRect(L, T, pw, ph);                       // millimetre graph paper
    g.strokeStyle = '#dcf1df'; g.lineWidth = .6; g.beginPath(); for (let x = L; x <= L + pw; x += 5) { g.moveTo(x, T); g.lineTo(x, T + ph); } for (let y = T + ph; y >= T; y -= 5) { g.moveTo(L, y); g.lineTo(L + pw, y); } g.stroke();
    g.strokeStyle = '#a5dbaf'; g.lineWidth = 1.1; g.beginPath(); for (let x = L; x <= L + pw; x += 50) { g.moveTo(x, T); g.lineTo(x, T + ph); } for (let y = T + ph; y >= T; y -= 50) { g.moveTo(L, y); g.lineTo(L + pw, y); } g.stroke();
    g.strokeStyle = '#151d45'; g.lineWidth = 2; g.beginPath(); g.moveTo(L, T); g.lineTo(L, T + ph); g.lineTo(L + pw, T + ph); g.stroke();
    const st = S.scale === 'bad' ? 0.37 : +S.scale, dec = S.scale === 'bad' ? 2 : st < 1 ? 1 : 0;
    g.fillStyle = '#4a5378'; g.font = '11.5px monospace'; g.lineWidth = 1;
    g.textAlign = 'center'; for (let v = Math.ceil(xr[0] / st - 1e-9) * st; v <= xr[1] + 1e-9; v += st) { const px = X(v); g.beginPath(); g.moveTo(px, T + ph); g.lineTo(px, T + ph + 6); g.stroke(); g.fillText(v.toFixed(dec), px, T + ph + 20); }
    g.textAlign = 'right'; for (let v = Math.ceil(yr[0] / st - 1e-9) * st; v <= yr[1] + 1e-9; v += st) { const py = Y(v); g.beginPath(); g.moveTo(L - 6, py); g.lineTo(L, py); g.stroke(); g.fillText(v.toFixed(dec), L - 10, py + 4); }
    g.fillStyle = '#151d45'; g.textAlign = 'center'; g.font = '13px sans-serif';
    g.fillText((S.swap ? 'Voltage, V (V)' : 'Current, I (A)') + '   [abscissa, independent variable]', L + pw / 2, h - 14);
    g.save(); g.translate(18, T + ph / 2); g.rotate(-Math.PI / 2); g.fillText((S.swap ? 'Current, I (A)' : 'Voltage, V (V)') + '   [ordinate, dependent variable]', 0, 0); g.restore();
    g.font = 'bold 15px sans-serif'; g.fillText(`Plot of ${S.swap ? 'current against voltage' : 'voltage against current'}`, w / 2, 26);
    g.save(); g.beginPath(); g.rect(L, T, pw, ph); g.clip();
    if (S.join) { g.strokeStyle = '#c62828'; g.lineWidth = 1.5; g.setLineDash([4, 4]); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.stroke(); g.setLineDash([]); }
    g.strokeStyle = 'rgba(210,71,11,.8)'; g.lineWidth = 3.5; g.beginPath(); g.moveTo(X(xr[0]), Y(S.m * xr[0] + S.c)); g.lineTo(X(xr[1]), Y(S.m * xr[1] + S.c)); g.stroke();

    if (S.fit && ft) { g.strokeStyle = '#0b7a5a'; g.lineWidth = 2; g.setLineDash([7, 4]); g.beginPath(); g.moveTo(X(xr[0]), Y(ft.m * xr[0] + ft.c)); g.lineTo(X(xr[1]), Y(ft.m * xr[1] + ft.c)); g.stroke(); g.setLineDash([]); }

  host.append(
    steps(['Check the plot convention: the dependent variable goes on the vertical axis.', 'Choose a scale where one division is 1, 2 or 5 units. Try the awkward scale to see why.', 'Move the ruler (slope and intercept) until about half the points lie on each side, spread evenly along it.', 'Tick <b>Show the least-squares line</b> to compare your ruler with the calculated best fit.', 'Try the bad habits (joining dots, no circles) and read the warnings.']),
    section('Graph paper', el('div', { class: 'bench' },
      el('div', { class: 'stage' }, el('div', { class: 'vizbox' }, cv.el), el('div', { class: 'meters' }, M.up.el, M.dn.el, M.fit.el), status),
      el('div', { class: 'controls' },
        select('Plot convention', [['c', 'Correct: voltage (V) against current (I)'], ['s', 'Incorrect: current (I) against voltage (V)']], 'c', v => { S.swap = v === 's'; up(); }),
        select('Axis division (the 1, 2, 5 rule)', [['1', '1 division = 1 unit'], ['2', '1 division = 2 units'], ['0.5', '1 division = 0.5 unit'], ['bad', '1 division = 0.37 unit (awkward)']], '1', v => { S.scale = v; up(); }),
        el('h3', {}, 'Transparent ruler'),
        slider({ label: 'Ruler slope, m', min: 0.2, max: 3, step: 0.05, value: S.m, fmt: v => fx(v, 2), color: CV.i, onInput: v => { S.m = v; up(); } }).el,
        slider({ label: 'Ruler intercept, c', min: -2, max: 4, step: 0.1, value: S.c, fmt: v => fx(v, 1), color: CV.i, onInput: v => { S.c = v; up(); } }).el,
        check('Show the least-squares line', S.fit, v => { S.fit = v; up(); }).el,
        el('h3', {}, 'Graphing conventions'),
        check('Enclose each dot in a circle', S.circ, v => { S.circ = v; up(); }).el,
        check('Connect the dots directly (incorrect)', S.join, v => { S.join = v; up(); }).el,
        check('Include the origin (0, 0)', S.origin, v => { S.origin = v; up(); }).el))),
    section('What is going on', insight(`<p>A straight line drawn through scattered points smooths out the random error in each one, so its slope is a better result than any single pair of readings. The best position leaves about half the points above the ruler and half below, spread evenly along its length.</p>
      <p>Graph paper is ruled in tens, so a division worth 1, 2 or 5 units lets you place and read a point without arithmetic. A division worth 0.37 units makes every point a calculation and every reading a likely mistake.</p>
      <p>It is not always necessary to include the origin. Untick it and the same data fills the paper, which makes the slope easier to read.</p>`)));
}

const LEDM = { nVt: 0.0869, Is: 2.04e-12 };       // red LED: about 1.8 V at 2 mA, 2.0 V at 20 mA

const vbeOf = ib => BJT.VT * Math.log(ib / BJT.IBS + 1);

  if (g(0.15) < 0) { vo = Math.min(0.15, vcc); sat = true; } else vo = bisect(v => -g(v), 0.15, Math.max(vcc, 0.16));
  const il = ledI(vo, 10);
  return { vo, il, ib: [ib], ie: [Math.max(0, (vcc - vo) / RC - il) + ib], rc: Math.max(0, (vcc - vo) / RC), st: [ib < 1e-7 ? 'cut-off (open switch)' : sat ? 'saturated (closed switch)' : 'active (part-way on)'] };
}

  const RB = 10000, B = 200, av = vcc - 0.7, off = { vo: 0, il: 0, ib: [0, 0], ie: [0, 0], re: 0, st: [a && av > 0 ? 'base driven, but T₂ blocks the path' : 'cut-off', 'cut-off'] };
  if (!b || av <= 0) return off;
  const drive = v => (av - v) / RB + (a ? (B + 1) * Math.max(0, av - 0.2 - v) / RB : 0);
  const vo = bisect(v => v / 1000 + ledI(v, 1010) - drive(v), 0, av), il = ledI(vo, 1010), ib1 = a ? Math.max(0, av - 0.2 - vo) / RB : 0, ib2 = (av - vo) / RB;
  return { vo, il, ib: [ib1, ib2], ie: [(B + 1) * ib1, (B + 1) * ib1 + ib2], re: vo / 1000, st: [a ? 'on' : 'cut-off', a ? 'saturated (on)' : 'base driven, but no collector current'] };

function gateOR(vcc, a, b) {
  const av = vcc - 0.7, n = (a ? 1 : 0) + (b ? 1 : 0);

}
